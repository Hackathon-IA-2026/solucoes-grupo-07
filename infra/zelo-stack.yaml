AWSTemplateFormatVersion: "2010-09-09"
Description: "Zelo - Deploy Streamlit no ECS Fargate sem IAM (Zero PassRole)"

Parameters:
  ImageUri:
    Type: String
    Description: "URI da imagem publica no Docker Hub (ex: seu-usuario/zelo:latest)"

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC existente (Default VPC)"

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "Subnets publicas existentes separadas por virgula"

Resources:
  ZeloCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: "zelo-cluster"

  ZeloTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: "zelo-task"
      RequiresCompatibilities:
        - "FARGATE"
      Cpu: "1024"
      Memory: "4096"
      NetworkMode: "awsvpc"
      ContainerDefinitions:
        - Name: "zelo-app"
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 8501
              HostPort: 8501
              Protocol: tcp

  ZeloService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: "zelo-service"
      Cluster: !Ref ZeloCluster
      TaskDefinition: !Ref ZeloTaskDefinition
      LaunchType: "FARGATE"
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: "ENABLED"
          Subnets: !Ref SubnetIds

Outputs:
  ClusterName:
    Description: "Nome do Cluster ECS"
    Value: !Ref ZeloCluster