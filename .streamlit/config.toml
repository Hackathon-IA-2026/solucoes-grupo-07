[theme]
base = "light"
primaryColor = "#C4391D"
backgroundColor = "#F7F5F0"
secondaryBackgroundColor = "#EFECE5"
textColor = "#16181D"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
headingFont = "Instrument Serif:https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap"
baseRadius = "small"
borderColor = "#DDD8CC"
dataframeBorderColor = "#DDD8CC"
dataframeHeaderBackgroundColor = "#EFECE5"
showWidgetBorder = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
